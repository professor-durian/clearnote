<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ClearNote settings</title>
    <style>
      :root { color-scheme: dark; }
      body { max-width: 520px; margin: 32px auto; padding: 0 16px;
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #11161d; color: #e6edf3; }
      h1 { font-size: 18px; }
      h2 { font-size: 14px; margin: 24px 0 6px; }
      label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 13px; }
      .hint { color: #8b97a6; font-size: 12px; font-weight: 400; }
      input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; font: inherit;
        padding: 8px 10px; border-radius: 8px; border: 1px solid #2a3340; background: #0e131a; color: #e6edf3; }
      button, a.btn { font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid #2f7cf6;
        background: #2f7cf6; color: #fff; cursor: pointer; text-decoration: none; display: inline-block; }
      button.ghost { background: #1a222c; border-color: #2a3340; color: #d7e0ea; }
      #saved, #micState { margin-left: 10px; color: #3ddc84; font-size: 12.5px; }
      .card { border: 1px solid #2a3340; border-radius: 12px; padding: 14px 16px; margin: 16px 0; background: #161c25; }
    </style>
  </head>
  <body>
    <h1>ClearNote</h1>

    <div class="card">
      <b>Your name, capture options, AI keys and calendar</b>
      <p class="hint">All of these are in the dashboard's Settings, so there is one place to change them.</p>
      <a class="btn" id="openDashboard" href="#" target="_blank" rel="noreferrer">Open Settings</a>
    </div>

    <h2>Microphone</h2>
    <p class="hint">Needed only to record your own voice alongside the call. Chrome asks once.</p>
    <button type="button" class="ghost" id="allowMic">Allow microphone</button><span id="micState"></span>

    <h2>Connection</h2>
    <label for="serverUrl">Server address</label>
    <input id="serverUrl" type="text" placeholder="http://localhost:8787" />
    <label for="token">Sync token <span class="hint">Only if you set CLEARNOTE_TOKEN on the server.</span></label>
    <input id="token" type="password" />
    <p><button id="save">Save</button><span id="saved"></span></p>

    <script src="options.js"></script>
  </body>
</html>
