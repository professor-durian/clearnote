<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ClearNote</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        width: 320px; margin: 0; padding: 14px 16px 12px;
        font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #18181b; color: #e4e4e7;
      }
      header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      .mark { width: 18px; height: 18px; background: url("../icons/mark.svg") center/contain no-repeat; }
      h1 { font-size: 14px; margin: 0; flex: 1; }
      .server { font-size: 11px; color: #a1a1aa; }
      .server.bad { color: #fca5a5; }
      .where { border: 1px solid #3f3f46; border-radius: 8px; padding: 10px 12px; background: #1f1f23; }
      .where .site { font-weight: 600; color: #fafafa; }
      .where .detail { color: #a1a1aa; font-size: 12px; margin-top: 2px; }
      .status { margin-top: 8px; font-size: 12px; color: #d4d4d8; }
      .choices { margin: 12px 0 0; display: flex; flex-direction: column; gap: 8px; }
      .choice { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid #3f3f46; border-radius: 8px; cursor: pointer; }
      .choice:hover { background: #222226; }
      .choice input { margin: 2px 0 0; accent-color: #0ea5e9; width: 15px; height: 15px; }
      .choice b { display: block; color: #fafafa; font-weight: 600; }
      .choice span { color: #a1a1aa; font-size: 12px; }
      .choice.done { cursor: default; opacity: .8; }
      button.main, a.link {
        font: inherit; font-weight: 600; border-radius: 8px; cursor: pointer; text-decoration: none; text-align: center;
      }
      button.main { width: 100%; margin-top: 12px; padding: 9px 12px; border: 1px solid #0284c7; background: #0284c7; color: #fff; }
      button.main:hover { background: #0369a1; }
      button.main.quiet { background: #27272a; border-color: #3f3f46; color: #e4e4e7; }
      button.main:disabled { opacity: .5; cursor: default; }
      .msg { margin-top: 10px; font-size: 12px; color: #d4d4d8; }
      .msg a { color: #7dd3fc; }
      .rec { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: #27272a; }
      .rec .t { flex: 1; }
      .rec .clock { font-variant-numeric: tabular-nums; color: #a1a1aa; }
      footer { display: flex; gap: 12px; margin-top: 14px; padding-top: 10px; border-top: 1px solid #27272a; font-size: 12px; }
      footer a { color: #a1a1aa; text-decoration: none; }
      footer a:hover { color: #fafafa; }
      footer .spacer { flex: 1; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header><span class="mark"></span><h1>ClearNote</h1><span class="server" id="server"></span></header>

    <section class="where">
      <div class="site" id="site">…</div>
      <div class="detail" id="detail"></div>
      <div class="status" id="status"></div>
    </section>

    <div class="rec" id="recbox" hidden>
      <span class="t" id="rectext">Recording audio</span>
      <span class="clock" id="clock"></span>
    </div>

    <form class="choices" id="choices"></form>
    <button class="main" id="go" hidden>Start</button>
    <p class="msg" id="msg"></p>

    <footer>
      <a id="dash" href="#" target="_blank" rel="noreferrer">Dashboard</a>
      <a id="settingsLink" href="#" target="_blank" rel="noreferrer">Settings</a>
      <span class="spacer"></span>
      <a id="retry" href="#" hidden>Retry sync</a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
