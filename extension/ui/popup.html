<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ClearNote</title>
    <style>
      :root { color-scheme: dark; }
      body {
        width: 280px; margin: 0; padding: 14px;
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #11161d; color: #e6edf3;
      }
      h1 { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 0 0 12px; }
      .mark { width: 18px; height: 18px;
        background: url("../icons/mark.svg") center/contain no-repeat; }
      .row { display: flex; justify-content: space-between; align-items: center;
        padding: 7px 0; border-bottom: 1px solid #1e2531; }
      .row:last-of-type { border-bottom: 0; }
      .k { color: #8b97a6; }
      .v { font-weight: 600; }
      .ok { color: #3ddc84; }
      .bad { color: #f0734a; }
      .warn { color: #f0b429; }
      .actions { display: flex; gap: 8px; margin-top: 12px; }
      button, a.btn {
        flex: 1; text-align: center; font: inherit; font-weight: 600; padding: 7px 8px;
        border-radius: 8px; border: 1px solid #2a3340; background: #1a222c;
        color: #d7e0ea; cursor: pointer; text-decoration: none;
      }
      button:hover, a.btn:hover { background: #222c38; }
      a.btn.primary { background: #2f7cf6; border-color: #2f7cf6; color: #fff; }
      p.hint { color: #7a8492; font-size: 11.5px; margin: 10px 0 0; }
      .audio { margin-top: 12px; }
      .audio p.hint { margin-top: 6px; }
      button.rec { width: 100%; background: #f0734a; border-color: #f0734a; color: #fff; }
      button.rec:hover { background: #f4865f; }
      button.rec.on { background: #1a222c; border-color: #f0734a; color: #f0734a; }
    </style>
  </head>
  <body>
    <h1><span class="mark"></span> ClearNote</h1>
    <div class="row"><span class="k">Server</span><span class="v" id="server">…</span></div>
    <div class="row"><span class="k">Queued</span><span class="v" id="pending">…</span></div>
    <div class="row"><span class="k">Auto-capture</span><span class="v" id="auto">…</span></div>
    <div class="audio" id="audio">
      <button id="rec" class="rec" hidden>Record audio</button>
      <p class="hint" id="recHint"></p>
    </div>
    <div class="actions">
      <a class="btn primary" id="dash" href="#" target="_blank" rel="noreferrer">Dashboard</a>
      <button id="retry">Retry sync</button>
    </div>
    <div class="actions">
      <a class="btn" id="settingsLink" href="#" target="_blank" rel="noreferrer">Settings</a>
    </div>
    <p class="hint">No bot joins your calls. ClearNote reads the captions the meeting platform already generates.</p>
    <script src="popup.js"></script>
  </body>
</html>
